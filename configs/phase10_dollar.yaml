source_id: dollar
description: HistData EURUSD M1 candidate; inverse-EURUSD modeled availability research only
source_url: https://www.histdata.com/f-a-q/data-files-detailed-specification/
market_hours: OTC vendor quote stream; gaps and market closures stay missing/stale
source_timezone: Fixed UTC-05:00 without daylight saving time
publication_delay_seconds: 60
stale_after_seconds: 600
availability_basis: modeled_latency
revision_policy: append_only
availability_evidence: >-
  HistData does not provide historical per-row release or revision timestamps.
  Candle close plus 60 seconds is an unverified exploratory assumption; current
  ingestion time is stored separately and does not prove historical availability.
missing_policy: price_only_fallback
enabled: false
