[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-forecasting"
version = "0.1.0"
description = "Reproducible, leakage-aware XAU/USD forecasting research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "LicenseRef-Proprietary"
authors = [{ name = "Loren" }]
dependencies = [
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
gold-forecast = "gold_forecasting.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gold_forecasting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gold_forecasting"]
